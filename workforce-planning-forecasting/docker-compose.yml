version: '3.9'

services:
  db:
    image: postgres:15
    container_name: workforce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workforce_db
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
